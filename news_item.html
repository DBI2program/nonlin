---
layout: default
---
<section class="page-hero compact">
  <div class="container narrow">
    <div class="eyebrow">{{ page.category | default: 'NEWS' }}</div>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%d %B %Y" }}</p>
  </div>
</section>
<section class="section">
  <article class="container narrow prose">{{ content }}</article>
</section>
